name: Publish to Chrome Web Store

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and package Chrome extension
        run: npx extension build --browser=chrome --polyfill --zip --no-telemetry

      - name: Upload and publish to Chrome Web Store
        env:
          CHROME_WEBSTORE_SERVICE_ACCOUNT_JWT: ${{ secrets.CHROME_WEBSTORE_SERVICE_ACCOUNT_JWT }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
        run: |
          ZIP=$(ls dist/chrome/code-injector-*.zip | head -1)
          echo "Publishing $ZIP"
          CHROME_ZIP_PATH="$ZIP" npm run publish:chrome
