name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chrome:
    name: Publish to Chrome Web Store
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and package Chromium extension
        run: npm run zip:chrome

      - name: Upload and publish to Chrome Web Store
        env:
          CHROME_WEBSTORE_SERVICE_ACCOUNT_JWT: ${{ secrets.CHROME_WEBSTORE_SERVICE_ACCOUNT_JWT }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
        run: |
          ZIP=$(ls dist/chrome/*.zip | head -1)
          echo "Publishing $ZIP"
          CHROME_ZIP_PATH="$ZIP" npm run publish:chrome

  firefox:
    name: Package Firefox build
    runs-on: ubuntu-latest
    # Submitting to addons.mozilla.org still needs signing credentials, so the
    # build is attached to the release for manual upload in the meantime.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and package Firefox extension
        run: npm run zip:firefox

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: firefox-extension
          path: dist/firefox/*.zip

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/firefox/*.zip --clobber
